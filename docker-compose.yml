name: dentalsuite

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dentalsuite_app
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - dentalsuite

  nginx:
    image: nginx:stable-alpine
    container_name: dentalsuite_nginx
    ports:
      - '8000:80'
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dentalsuite

  postgres:
    image: postgres:17-alpine
    container_name: dentalsuite_postgres
    environment:
      POSTGRES_DB: dentalsuite
      POSTGRES_USER: dentalsuite
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - dentalsuite

  redis:
    image: redis:7-alpine
    container_name: dentalsuite_redis
    ports:
      - '6379:6379'
    networks:
      - dentalsuite

  node:
    image: node:22-alpine
    container_name: dentalsuite_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '5173:5173'
    networks:
      - dentalsuite

networks:
  dentalsuite:
    driver: bridge

volumes:
  pgdata:

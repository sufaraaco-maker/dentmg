<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalSuite</title>
    <!--
      Self-hosted (frontend/src/assets/fonts/, see docs/design-system.md §1) — no external font CDN
      request. Preloading only the two faces the default locale (ar/RTL) needs for first paint;
      inter-latin-ext-var (Turkish-only glyphs) isn't preloaded since it's never needed immediately.
    -->
    <link
      rel="preload"
      href="/src/assets/fonts/alexandria-arabic-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

; Local-dev override of the base php:8.4-fpm-alpine image's default pool config
; (`pm.max_children = 5`). A single Appointments board page load already fires 4-5
; concurrent XHR requests (appointments range, providers, appointment types, working
; hours/time off), and opening the New Appointment dialog or searching patients adds
; more on top — enough to saturate a 5-worker pool and make requests queue/time out
; (observed directly: `pm.max_children` warnings plus a stalled `POST /api/appointments`
; during this module's real-browser verification). Not a production tuning decision —
; production pool sizing depends on the deployment's actual CPU/memory budget — this is
; just enough headroom for local development's default docker-compose stack.
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Frontend SPA (built via `npm run build`, bind-mounted read-only from ./frontend/dist).
    root /usr/share/nginx/frontend;
    index index.html;

    # API, Sanctum CSRF cookie, and the health-check route are served by php-fpm out of the
    # backend's public/ document root instead of the frontend's.
    location /api {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location /sanctum {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tests, PHPStan, Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_pgsql, redis, mbstring, intl, gd, bcmath, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: cp .env.example .env && php artisan key:generate

      - name: Run Pint (style check)
        run: vendor/bin/pint --test

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (type-check, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check src/

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://ci-placeholder.example/api
          VITE_APP_URL: https://ci-placeholder.example

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    # Full-stack browser tests are slower and need Postgres/Redis — run on every push to main
    # (so a broken main is caught fast) plus on-demand via workflow_dispatch, but not on every PR,
    # to keep PR feedback from backend/frontend jobs fast. See docs/deployment.md "Production
    # Testing Pass" and TECH_DEBT.md for the reasoning.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dentalsuite
          POSTGRES_USER: dentalsuite
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis, mbstring, intl, gd, bcmath, zip
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Configure backend .env for E2E
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          # php artisan serve's built-in PHP dev server handles one request at a time by
          # default — a real browser driving the SPA fires several concurrent requests per
          # navigation (CSRF cookie, login POST, the router guard's immediate /api/user call),
          # which serializes and stalls badly under a single worker. See the commented hint
          # already in .env.example for exactly this setting.
          echo "PHP_CLI_SERVER_WORKERS=4" >> .env
          # The full Playwright suite runs single-worker, sequentially, all as the same demo
          # admin user, well within one throttle window — every added spec (e.g. laboratory.spec.ts)
          # pushes the total request count further past the production-matching 120/min default
          # (see AppServiceProvider's RateLimiter::for('api', ...)), causing unrelated later specs
          # to fail with 429. CI-only; production keeps the real 120/min default from .env.example.
          echo "API_THROTTLE_PER_MINUTE=1000" >> .env

      - name: Migrate and seed (demo accounts — APP_ENV=local, matches docs/demo-guide.md)
        working-directory: backend
        run: php artisan migrate:fresh --seed --force

      - name: Start backend server
        working-directory: backend
        # `localhost`, not 127.0.0.1 — must match backend/.env.example's FRONTEND_URL and
        # SANCTUM_STATEFUL_DOMAINS (both "localhost:5173") exactly, or every browser-driven
        # request's Origin header fails Sanctum/CORS's origin check and gets silently blocked
        # by the browser before it ever reaches the server. This was the actual root cause of
        # 12/13 E2E tests hanging until timeout in earlier CI runs — not a real app bug, and not
        # the php artisan serve worker-count issue that commit ba2bc1c (also fixed, still
        # needed) addressed.
        run: PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=localhost --port=8000 &

      - name: Start queue worker
        working-directory: backend
        # QUEUE_CONNECTION=redis by default (backend/.env.example) and SendsNotifications has been
        # ShouldQueue since Phase 5B — without a real worker consuming the Redis queue, every
        # notification-producing action in the E2E suite enqueues and silently never delivers,
        # which looks like "no notification was ever created" rather than a queue problem. Mirrors
        # the queue container dev/prod compose already run; --stop-when-empty is deliberately not
        # used since the suite dispatches jobs throughout its run, not just at the start.
        run: php artisan queue:work --tries=1 &

      - name: Seed a low-stock supply and run the Phase 5C scheduled notification commands
        working-directory: backend
        # Phase 5C's new `inventory` category (design doc §5.2, type 10) has no user-facing action
        # that creates it — it only ever comes from the daily `notifications:low-stock-digest`
        # command, which nothing else in this job would otherwise trigger. Closes the real gap
        # TECH_DEBT.md tracked ("Phase 5C not yet E2E/real-browser verified"): a real browser never
        # confirmed the new `inventory` category chip renders actual content. `SupplyFactory`'s
        # default `reorder_level` (5-50) with zero stock movements already qualifies as low stock
        # (`Supply::lowStock()`'s `COALESCE(sm.on_hand, 0) <= reorder_level`), so no bespoke
        # stock-movement fixture is needed. Runs once, before the frontend starts, so the
        # notification already exists by the time notifications.spec.ts logs in as admin.
        run: |
          php artisan tinker --execute="\App\Models\Supply::factory()->create();"
          php artisan notifications:low-stock-digest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: npm run dev -- --host --port 5173 &
        env:
          VITE_API_URL: http://localhost:8000/api
          VITE_APP_URL: http://localhost:8000

      - name: Wait for both servers
        run: |
          npx wait-on http://localhost:8000/api/ping http://localhost:5173 --timeout 60000

      - name: Run E2E suite
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000/api

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
